<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silivri3d</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#202d28;font-family:Arial,sans-serif}header{padding:25px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce1d7;background:#fafbf7}.logo{font-weight:800;letter-spacing:2px}.logo b{color:#418267}header span{font-size:12px;color:#68756c}.wrap{max-width:1280px;margin:auto;padding:54px 6%}.intro{display:flex;align-items:end;justify-content:space-between;gap:25px}.eyebrow{color:#498266;letter-spacing:2px;font-size:11px;font-weight:bold}h1{font-size:clamp(34px,5vw,58px);letter-spacing:-2px;margin:15px 0}p{color:#718075;line-height:1.6}.badge{padding:12px 18px;border:1px solid #d9dfd3;border-radius:30px;white-space:nowrap;font-size:12px}.tools{margin:35px 0 23px;display:flex;gap:12px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:17px 20px;border:1px solid #dce1d7;border-radius:12px;font-size:15px;background:white;outline-color:#39745b}select{padding:14px;border:1px solid #dce1d7;border-radius:12px;background:white;color:#394d40}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}button,a{font:inherit}button{cursor:pointer}.filters button{border:1px solid #dce1d7;background:transparent;padding:10px 18px;border-radius:25px;color:#5b6b60}.filters button.active{background:#254d3b;color:white;border-color:#254d3b}.count{font-size:12px;color:#718075;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid #e0e5da;border-radius:18px;overflow:hidden;transition:transform .2s}.card:hover{transform:translateY(-4px)}.picture{height:235px;background:#e9ede4;position:relative;display:flex;align-items:center;justify-content:center}.picture img{width:100%;height:100%;object-fit:contain;padding:20px}.type{position:absolute;left:15px;top:15px;background:#ffffffdf;border-radius:6px;padding:6px 9px;font-size:10px;font-weight:bold}.content{padding:22px}.category{text-transform:uppercase;font-size:10px;letter-spacing:1.5px;color:#718075}h2{font-size:18px;line-height:1.4;margin:10px 0 18px;min-height:50px;overflow-wrap:anywhere}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}.bottom span{font-size:11px;color:#849084}.open{display:inline-block;background:#264f3c;color:white;text-decoration:none;border-radius:8px;padding:12px 15px;font-size:12px}.note{margin-top:36px;padding-top:23px;border-top:1px solid #dce1d7;font-size:12px;color:#7e887e}.empty{padding:35px;color:#718075;grid-column:1/-1}footer{display:flex;justify-content:space-between;gap:20px;margin-top:48px;font-size:11px;color:#889086}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{display:block}.badge{display:inline-block;margin-top:12px}.wrap{padding-top:30px}header{gap:15px}.picture{height:210px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.picture{height:260px}header span{max-width:105px;line-height:1.5}h1{letter-spacing:-1px}.tools select{width:100%}footer{flex-direction:column}}
</style>
<header><div class="logo">Silivri3d</div></header>
<main class="wrap"><div class="intro"><div><div class="eyebrow">MODEL ARŞİVİ / KEŞFET</div><h1>Model arşivi</h1></div></div>
<div class="tools"><button class="open" id="refresh">↻ Yenile</button><input id="search" aria-label="Model ara" placeholder="Model adıyla ara…"><select id="sort" aria-label="Sıralama"><option value="default">Öne çıkanlar</option><option value="name">İsme göre A → Z</option><option value="size">Boyuta göre</option></select></div>
<div class="filters" id="filters"></div><div class="count" id="count"></div><section class="grid" id="grid" aria-live="polite"></section>
<div class="note">Drive bağlantıları mevcut erişim izinlerinle açılır.</div><footer><span>Silivri3d</span><span></span></footer></main>
<script>
let models=[];let category='Tümü';const $=id=>document.getElementById(id);const norm=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function filters(){ $('filters').replaceChildren();for(const name of ['Tümü',...new Set(models.map(m=>m.category))]){const b=document.createElement('button');b.textContent=name;b.className=name===category?'active':'';b.onclick=()=>{category=name;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()};$('filters').append(b)}}
function render(){let list=models.filter(m=>(category==='Tümü'||m.category===category)&&norm(m.name+' '+m.category+' '+m.brand).includes(norm($('search').value)));if($('sort').value==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'tr'));if($('sort').value==='size')list.sort((a,b)=>a.size-b.size);$('count').textContent=list.length+' model gösteriliyor';$('grid').replaceChildren();for(const m of list){const card=document.createElement('article');card.className='card';card.innerHTML='<div class="picture"><img loading="lazy"><span class="type"></span></div><div class="content"><div class="category"></div><h2></h2><div class="bottom"><span></span><a class="open" target="_blank" rel="noopener noreferrer">Drive’da aç ↗</a></div></div>';if(m.image)card.querySelector('img').src=m.image;else{card.querySelector('img').remove();const placeholder=document.createElement('span');placeholder.textContent='◇ Önizleme yok';card.querySelector('.picture').append(placeholder);}if(card.querySelector('img'))card.querySelector('img').alt=m.name;card.querySelector('.type').textContent=m.type;card.querySelector('.category').textContent=[m.category,m.brand].filter(Boolean).join(' / ');card.querySelector('h2').textContent=m.name.replaceAll('_',' ');card.querySelector('.bottom span').textContent=(m.size/1048576).toFixed(1)+' MB';card.querySelector('a').href='https://drive.google.com/file/d/'+encodeURIComponent(m.id)+'/view';$('grid').append(card)}if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='Bu aramaya uygun model bulunamadı.';$('grid').append(e)}}$('search').oninput=render;$('sort').onchange=render;
async function load(){const button=$('refresh');button.disabled=true;$('count').textContent='Drive arşivi okunuyor…';try{const r=await fetch('./catalog.json?t='+Date.now(),{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error);models=data.models;filters();render();$('count').textContent+=' · Son kontrol: '+new Date(data.updatedAt).toLocaleTimeString('tr-TR');}catch(e){$('count').textContent=e.message||'Drive bağlantısı kurulamadı.';}finally{button.disabled=false;}}
$('refresh').onclick=load;load();
</script></html>
