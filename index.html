<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silivri3d</title><link rel="stylesheet" href="./style.css?v=4"></head><body>
<header><div class="logo">Silivri3d</div></header><main class="wrap"><div class="eyebrow">MODEL ARŞİVİ</div><h1>Model arşivi</h1>
<div class="tools"><input id="search" type="search" aria-label="Model ara" placeholder="Model adıyla ara…"><select id="format" class="type-filter" aria-label="Dosya türü"><option value="">Tüm dosyalar</option><option>3MF</option><option>STL</option><option>ZIP</option><option>RAR</option></select><select id="sort" aria-label="Sıralama"><option value="default">Öne çıkanlar</option><option value="name">İsim: A → Z</option><option value="size">Boyuta göre</option></select><button class="subtle" id="refresh">↻ Yenile</button></div>
<nav class="filters" id="filters" aria-label="Kategoriler"></nav><section class="brand-panel" id="brand-panel" hidden><strong>Çakmak türü</strong><nav class="filters" id="brands" aria-label="Çakmak türleri"></nav></section>
<details class="visual-panel"><summary>▧ Görselle ara</summary><p class="hint">Bir görsel yapıştır, sürükleyip bırak veya dosya seç. Benzer önizlemeler tüm arşivde aranır. Görselin cihazında kalır.</p><div id="paste-zone" class="paste-zone" tabindex="0" role="group" aria-label="Görsel yapıştırma alanı"><span class="paste-icon" aria-hidden="true">▧</span><strong>Görseli buraya bırak</strong><span>veya Ctrl+V / ⌘V ile yapıştır</span></div><div class="visual-row"><img id="query-preview" alt="Arama görseli" hidden><label>Görsel seç<input type="file" id="visual-file" accept="image/png,image/jpeg,image/webp"></label><button class="subtle" id="paste-button">Panodan yapıştır</button><label>Karşılaştırma<select id="visual-mode"><option value="balanced">Şekil + renk</option><option value="shape">Şekil ağırlıklı</option></select></label><button class="subtle" id="clear-visual" hidden>Görsel aramayı temizle</button></div><div id="visual-status" class="status" role="status"></div></details>
<div class="count" id="count" role="status"></div><section class="grid" id="grid" aria-live="polite"></section><div class="note" id="updated"></div><div class="note">Drive bağlantıları mevcut erişim izinlerinle açılır.</div><footer><span>Silivri3d</span></footer></main><script src="./visual-search.js?v=4"></script><script src="./app.js?v=4"></script></body></html>
